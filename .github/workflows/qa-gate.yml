name: qa-gate-trusted

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release-qa-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: trusted-evaluator
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted consumer configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Check out the public Release QA evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Frogbyte-io/release-qa
          ref: main
          path: .release-qa
          persist-credentials: false
      - name: Evaluate current PR and publish required status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node --experimental-strip-types .release-qa/packages/qa/src/github/gate-cli.ts
