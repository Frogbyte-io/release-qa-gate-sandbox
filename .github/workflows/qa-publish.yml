name: qa-publish

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged release PR number
        required: true
        type: string
      expected_head:
        description: Tested PR head SHA captured before app merge
        required: true
        type: string
      reviewed_body_base64:
        description: Base64 PR body captured immediately before app merge
        required: true
        type: string

permissions: {}

concurrency:
  group: qa-publish-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Check out trusted Release QA publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Frogbyte-io/release-qa
          ref: 06fc99eacee37d5d60a1a0d8c4439b84296144c2
          path: .release-qa
          persist-credentials: false
      - name: Reevaluate and publish the tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF: ${{ github.ref }}
        run: node --experimental-strip-types .release-qa/packages/qa/src/github/publish-cli.ts
